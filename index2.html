<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bussola</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
     background:#f5f5f0;color:#1a1a1a;min-height:100vh;
     display:flex;flex-direction:column;align-items:center;padding:1.5rem 1rem}
h1{font-size:17px;font-weight:500;color:#555;margin-bottom:.25rem;text-align:center}
.sub{font-size:12px;color:#aaa;margin-bottom:1.25rem;text-align:center;letter-spacing:.3px}
.card{background:#fff;border-radius:16px;padding:1.25rem;
      border:0.5px solid rgba(0,0,0,0.07);box-shadow:0 2px 12px rgba(0,0,0,0.06);
      width:100%;max-width:340px;margin-bottom:1rem}
.compass-wrap{display:flex;flex-direction:column;align-items:center}
#cvs{width:260px;height:260px}
.dest-label{font-size:13px;color:#555;text-align:center;margin-top:.75rem}
.dest-label strong{color:#1D9E75;font-size:22px;font-weight:600;display:block;margin-top:4px}
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:1rem}
.metric{background:#f8f8f4;border-radius:10px;padding:.6rem .5rem;text-align:center}
.metric .lbl{font-size:10px;color:#aaa;margin-bottom:2px;text-transform:uppercase;letter-spacing:.4px}
.metric .val{font-size:17px;font-weight:600;color:#1a1a1a}
.badge{text-align:center;font-size:13px;padding:8px 16px;border-radius:10px;
       background:#fff8e1;color:#795548;width:100%;max-width:340px;margin-bottom:1rem;
       line-height:1.4}
.badge.ok  {background:#e8f5e9;color:#2e7d32}
.badge.err {background:#ffebee;color:#c62828}
.badge.info{background:#e3f2fd;color:#1565c0}
#start-btn{width:100%;max-width:340px;padding:14px;border:none;border-radius:12px;
           font-size:16px;font-weight:500;background:#1D9E75;color:#fff;cursor:pointer;
           box-shadow:0 4px 12px rgba(29,158,117,.3)}
#start-btn:active{opacity:.8}
</style>
</head>
<body>

<h1>&#129517; Bussola</h1>
<p class="sub">40°51′57.5″N &nbsp; 14°23′51.1″E</p>

<div id="badge" class="badge">Premi Avvia per cominciare</div>

<div class="card">
  <div class="compass-wrap">
    <svg id="cvs" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <circle cx="100" cy="100" r="96" fill="#fafafa" stroke="#e8e8e8" stroke-width="1.5"/>
      <circle cx="100" cy="100" r="74" fill="none" stroke="#f0f0f0" stroke-width="1"/>
      <g stroke="#ddd" stroke-width="1.2">
        <line x1="100" y1="4"   x2="100" y2="20"/>
        <line x1="100" y1="180" x2="100" y2="196"/>
        <line x1="4"   y1="100" x2="20"  y2="100"/>
        <line x1="180" y1="100" x2="196" y2="100"/>
      </g>
      <g stroke="#eee" stroke-width="0.8">
        <line x1="152" y1="11"  x2="144" y2="25"/>
        <line x1="189" y1="48"  x2="175" y2="56"/>
        <line x1="189" y1="152" x2="175" y2="144"/>
        <line x1="152" y1="189" x2="144" y2="175"/>
        <line x1="48"  y1="189" x2="56"  y2="175"/>
        <line x1="11"  y1="152" x2="25"  y2="144"/>
        <line x1="11"  y1="48"  x2="25"  y2="56"/>
        <line x1="48"  y1="11"  x2="56"  y2="25"/>
      </g>
      <text x="100" y="19"  text-anchor="middle" font-size="15" font-weight="700" fill="#E24B4A">N</text>
      <text x="100" y="196" text-anchor="middle" font-size="13" fill="#ccc">S</text>
      <text x="194" y="105" text-anchor="middle" font-size="13" fill="#ccc">E</text>
      <text x="6"   y="105" text-anchor="middle" font-size="13" fill="#ccc">O</text>
      <!-- Ago verde: destinazione fissa -->
      <g id="nd" transform="rotate(0,100,100)">
        <polygon points="100,26 106,96 100,114 94,96" fill="#1D9E75"/>
        <polygon points="100,114 106,96 100,174 94,96" fill="#c8ece2"/>
        <circle cx="100" cy="100" r="9" fill="#fff" stroke="#1D9E75" stroke-width="2.5"/>
        <circle cx="100" cy="100" r="3" fill="#1D9E75"/>
      </g>
      <!-- Ago rosso: nord bussola -->
      <g id="nc" transform="rotate(0,100,100)">
        <polygon points="100,24 108,96 100,114 92,96" fill="#E24B4A"/>
        <polygon points="100,114 108,96 100,174 92,96" fill="#e0e0e0"/>
        <circle cx="100" cy="100" r="6" fill="#fff" stroke="#ddd" stroke-width="1"/>
      </g>
      <text id="td" x="100" y="148" text-anchor="middle" font-size="9" fill="#ccc">--°</text>
    </svg>

    <p class="dest-label">
      Distanza<strong id="dist-val">--</strong>
    </p>

    <div class="metrics">
      <div class="metric"><div class="lbl">Heading</div><div class="val" id="mh">--</div></div>
      <div class="metric"><div class="lbl">Bearing</div><div class="val" id="mb">--</div></div>
      <div class="metric"><div class="lbl">Ruota di</div><div class="val" id="mr">--</div></div>
    </div>
  </div>
</div>

<button id="start-btn" onclick="startAll()">&#127919; Avvia</button>

<script>
// Destinazione fissa: 40°51'57.5"N  14°23'51.1"E
var DST_LAT = 40.865972;
var DST_LON = 14.397528;

var mLa=null, mLo=null, hdg=0, oOk=false, gpsOk=false;

function R(d){return d*Math.PI/180;}

function brng(a,b,c,d){
  var dl=R(d-b),r1=R(a),r2=R(c);
  var y=Math.sin(dl)*Math.cos(r2);
  var x=Math.cos(r1)*Math.sin(r2)-Math.sin(r1)*Math.cos(r2)*Math.cos(dl);
  return(Math.atan2(y,x)*180/Math.PI+360)%360;
}

function haversine(a,b,c,d){
  var K=6371,da=R(c-a),db=R(d-b);
  var p=Math.sin(da/2)*Math.sin(da/2)+
        Math.cos(R(a))*Math.cos(R(c))*Math.sin(db/2)*Math.sin(db/2);
  return K*2*Math.atan2(Math.sqrt(p),Math.sqrt(1-p));
}

function rot(id,a){
  document.getElementById(id)
    .setAttribute('transform','rotate('+a.toFixed(2)+',100,100)');
}
function g(id){return document.getElementById(id);}
function bdg(msg,cls){var b=g('badge');b.textContent=msg;b.className='badge'+(cls?' '+cls:'');}

function ui(){
  rot('nc',hdg);
  g('mh').textContent=Math.round(hdg)+'°';
  g('td').textContent=Math.round(hdg)+'°';
  if(mLa===null) return;
  var b=brng(mLa,mLo,DST_LAT,DST_LON);
  var d=haversine(mLa,mLo,DST_LAT,DST_LON);
  var delta=(b-hdg+360)%360;
  rot('nd',b);
  g('mb').textContent=Math.round(b)+'°';
  g('mr').textContent=Math.round(delta)+'°';
  g('dist-val').textContent=d>100?Math.round(d)+' km':d.toFixed(2)+' km';
  if(oOk&&gpsOk) bdg('Attivo — punta il telefono verso la freccia verde','ok');
}

function onOri(e){
  if(typeof e.webkitCompassHeading!=='undefined'&&e.webkitCompassHeading!==null){
    hdg=e.webkitCompassHeading;
  } else if(e.alpha!==null){
    hdg=(360-e.alpha)%360;
  }
  ui();
}

function startOri(){
  if(typeof DeviceOrientationEvent==='undefined'){bdg('Giroscopio non disponibile','err');return;}
  if(typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission()
      .then(function(s){
        if(s==='granted'){window.addEventListener('deviceorientation',onOri,true);oOk=true;}
        else bdg('Permesso orientamento negato — la freccia verde non ruoterà','err');
      }).catch(function(e){bdg('Errore orientamento: '+e,'err');});
  } else {
    window.addEventListener('deviceorientation',onOri,true);
    oOk=true;
  }
}

function startGPS(){
  if(!navigator.geolocation){bdg('GPS non disponibile','err');return;}
  bdg('Acquisizione GPS...','info');
  navigator.geolocation.watchPosition(
    function(p){
      mLa=p.coords.latitude;
      mLo=p.coords.longitude;
      gpsOk=true;
      ui();
    },
    function(e){bdg('GPS: '+e.message,'err');},
    {enableHighAccuracy:true,maximumAge:3000,timeout:15000}
  );
}

function startAll(){
  g('start-btn').style.display='none';
  startOri();
  startGPS();
}
</script>
</body>
</html>
