<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bussola Wi-Fi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
     background:#f5f5f0;color:#1a1a1a;min-height:100vh;padding:1rem}
h1{font-size:18px;font-weight:500;text-align:center;margin-bottom:1rem;color:#444}
.card{background:#fff;border-radius:14px;padding:1.1rem 1.25rem;
      margin-bottom:1rem;border:0.5px solid rgba(0,0,0,0.08);box-shadow:0 1px 4px rgba(0,0,0,0.04)}
label{font-size:12px;color:#777;display:block;margin-bottom:3px}
input{width:100%;padding:9px 10px;border:0.5px solid #ddd;border-radius:8px;
      font-size:14px;margin-bottom:8px;background:#fafafa;-webkit-appearance:none}
input:focus{outline:none;border-color:#378ADD;background:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{width:100%;padding:11px;border:none;border-radius:10px;
       font-size:14px;cursor:pointer;transition:opacity .15s;font-weight:500}
button:active{opacity:.7}
.btn-blue{background:#378ADD;color:#fff;margin-top:4px}
.btn-green{background:#1D9E75;color:#fff;margin-top:4px}
.btn-dest{background:#f0f0ec;color:#333;padding:9px 12px;text-align:left;
          font-size:13px;margin-bottom:5px;border-radius:9px;
          border:0.5px solid #e0e0d8;width:100%;font-weight:400}
.compass-wrap{display:flex;flex-direction:column;align-items:center;padding:.5rem 0 .25rem}
#cvs{width:230px;height:230px;margin:auto}
.legend{display:flex;justify-content:center;gap:20px;font-size:12px;color:#777;margin-top:.5rem}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:.75rem}
.metric{background:#f8f8f4;border-radius:10px;padding:.65rem .75rem}
.metric .lbl{font-size:11px;color:#888}
.metric .val{font-size:20px;font-weight:500;color:#1a1a1a}
.badge{text-align:center;font-size:12px;padding:7px 12px;border-radius:8px;
       margin-bottom:.75rem;background:#fff8e1;color:#795548;line-height:1.4}
.badge.ok{background:#e8f5e9;color:#2e7d32}
.badge.err{background:#ffebee;color:#c62828}
.badge.info{background:#e3f2fd;color:#1565c0}
.dest-cur{font-size:13px;color:#555;text-align:center;margin-top:.4rem}
.dest-cur strong{color:#1a1a1a}
.ip-row{display:flex;gap:8px;align-items:flex-end}
.ip-row input{margin-bottom:0}
.ip-row button{width:auto;padding:9px 16px;white-space:nowrap;margin-top:0}
.sep{border:none;border-top:0.5px solid #f0f0ec;margin:.5rem 0}
small{font-size:11px;color:#aaa;display:block;margin-top:4px}
</style>
</head>
<body>
<h1>&#129517; Bussola Wi-Fi</h1>

<!-- Badge stato -->
<div id="badge" class="badge">In attesa di avvio...</div>

<!-- Bussola grafica -->
<div class="card compass-wrap">
  <svg id="cvs" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <circle cx="100" cy="100" r="95" fill="none" stroke="#e8e8e8" stroke-width="1.5"/>
    <circle cx="100" cy="100" r="72" fill="none" stroke="#f4f4f4" stroke-width="1"/>
    <!-- Tacche -->
    <g stroke="#ddd" stroke-width="1">
      <line x1="100" y1="5"   x2="100" y2="20"/>
      <line x1="100" y1="180" x2="100" y2="195"/>
      <line x1="5"   y1="100" x2="20"  y2="100"/>
      <line x1="180" y1="100" x2="195" y2="100"/>
    </g>
    <g stroke="#eee" stroke-width="0.8">
      <line x1="156" y1="14"  x2="148" y2="27"/>
      <line x1="186" y1="44"  x2="173" y2="52"/>
      <line x1="186" y1="156" x2="173" y2="148"/>
      <line x1="156" y1="186" x2="148" y2="173"/>
      <line x1="44"  y1="186" x2="52"  y2="173"/>
      <line x1="14"  y1="156" x2="27"  y2="148"/>
      <line x1="14"  y1="44"  x2="27"  y2="52"/>
      <line x1="44"  y1="14"  x2="52"  y2="27"/>
    </g>
    <!-- Cardinali -->
    <text x="100" y="19"  text-anchor="middle" font-size="14" font-weight="700" fill="#E24B4A">N</text>
    <text x="100" y="194" text-anchor="middle" font-size="13" fill="#999">S</text>
    <text x="192" y="104" text-anchor="middle" font-size="13" fill="#999">E</text>
    <text x="8"   y="104" text-anchor="middle" font-size="13" fill="#999">O</text>
    <!-- Ago verde: destinazione -->
    <g id="nd" transform="rotate(0,100,100)" opacity="0.9">
      <polygon points="100,30 105,98 100,116 95,98" fill="#1D9E75"/>
      <polygon points="100,116 105,98 100,170 95,98" fill="#b2dfcf"/>
      <circle cx="100" cy="100" r="8" fill="#fff" stroke="#1D9E75" stroke-width="2"/>
    </g>
    <!-- Ago rosso: nord -->
    <g id="nc" transform="rotate(0,100,100)">
      <polygon points="100,26 107,98 100,116 93,98" fill="#E24B4A"/>
      <polygon points="100,116 107,98 100,170 93,98" fill="#ccc"/>
      <circle cx="100" cy="100" r="5" fill="#fff" stroke="#ddd" stroke-width="1"/>
    </g>
    <text id="td" x="100" y="150" text-anchor="middle" font-size="10" fill="#bbb">--°</text>
  </svg>

  <div class="legend">
    <span><span class="dot" style="background:#E24B4A"></span>Nord</span>
    <span><span class="dot" style="background:#1D9E75"></span>Destinazione</span>
  </div>
  <p class="dest-cur">Punta verso: <strong id="dn">--</strong></p>

  <div class="metrics">
    <div class="metric"><div class="lbl">Heading</div><div class="val" id="mh">--</div></div>
    <div class="metric"><div class="lbl">Bearing</div><div class="val" id="mb">--</div></div>
    <div class="metric"><div class="lbl">Distanza</div><div class="val" id="md">--</div></div>
    <div class="metric"><div class="lbl">Ruota di</div><div class="val" id="mr">--</div></div>
  </div>
</div>

<!-- Connessione ESP32 (opzionale) -->
<div class="card">
  <label>IP dell'ESP32 (opzionale)</label>
  <div class="ip-row">
    <input type="text" id="esp-ip" value="192.168.4.1" placeholder="192.168.4.1">
    <button class="btn-blue" onclick="pingEsp()">Connetti</button>
  </div>
  <small>Connettiti prima alla rete Wi-Fi "Bussola-ESP32", poi premi Connetti</small>
  <div id="esp-status" style="font-size:12px;color:#aaa;margin-top:6px"></div>
</div>

<!-- Avvio -->
<div class="card">
  <button class="btn-green" onclick="startAll()">&#127919; Avvia GPS e bussola</button>
  <small style="margin-top:8px;text-align:center">Il browser chiederà accesso a posizione e orientamento</small>
</div>

<!-- Destinazioni rapide -->
<div class="card">
  <label>Destinazioni rapide</label>
  <button class="btn-dest" onclick="qd(48.8566,2.3522,'Parigi')">&#127982; Parigi, Francia</button>
  <button class="btn-dest" onclick="qd(51.5074,-0.1278,'Londra')">&#127988; Londra, UK</button>
  <button class="btn-dest" onclick="qd(40.7128,-74.006,'New York')">&#127482;&#127480; New York, USA</button>
  <button class="btn-dest" onclick="qd(35.6762,139.6503,'Tokyo')">&#127471;&#127477; Tokyo, Giappone</button>
  <button class="btn-dest" onclick="qd(27.1751,78.0421,'Taj Mahal')">&#127470;&#127475; Taj Mahal, India</button>
  <button class="btn-dest" onclick="qd(29.9792,31.1342,'Piramidi di Giza')">&#127470;&#127468; Piramidi di Giza</button>
  <button class="btn-dest" onclick="qd(-33.8569,151.2153,'Sydney')">&#127462;&#127482; Sydney, Australia</button>
</div>

<!-- Destinazione personalizzata -->
<div class="card">
  <label>Destinazione personalizzata</label>
  <div class="row2">
    <div><label>Latitudine</label><input type="number" id="dlat" step="0.0001" placeholder="es. 41.9028"></div>
    <div><label>Longitudine</label><input type="number" id="dlon" step="0.0001" placeholder="es. 12.4964"></div>
  </div>
  <input type="text" id="dnam" placeholder="Nome luogo">
  <button class="btn-blue" onclick="sendDest()">Imposta destinazione</button>
</div>

<script>
// ── Stato ────────────────────────────────────────────────────
var mLa=null, mLo=null;
var dLa=null,  dLo=null, dNm='';
var hdg=0, oOk=false, gpsOk=false;
var espIP='192.168.4.1', espOk=false;
var sendTimer=null;

// ── Matematica ───────────────────────────────────────────────
function R(d){return d*Math.PI/180;}
function brng(a,b,c,d){
  var dl=R(d-b),r1=R(a),r2=R(c);
  var y=Math.sin(dl)*Math.cos(r2);
  var x=Math.cos(r1)*Math.sin(r2)-Math.sin(r1)*Math.cos(r2)*Math.cos(dl);
  return(Math.atan2(y,x)*180/Math.PI+360)%360;
}
function km(a,b,c,d){
  var K=6371,da=R(c-a),db=R(d-b);
  var p=Math.sin(da/2)*Math.sin(da/2)+
        Math.cos(R(a))*Math.cos(R(c))*Math.sin(db/2)*Math.sin(db/2);
  return K*2*Math.atan2(Math.sqrt(p),Math.sqrt(1-p));
}

// ── UI ───────────────────────────────────────────────────────
function rot(id,a){
  document.getElementById(id)
    .setAttribute('transform','rotate('+a.toFixed(1)+',100,100)');
}
function g(id){return document.getElementById(id);}
function bdg(msg,cls){
  var b=g('badge');b.textContent=msg;
  b.className='badge'+(cls?' '+cls:'');
}

function ui(){
  rot('nc', hdg);
  g('mh').textContent = Math.round(hdg)+'°';
  g('td').textContent = Math.round(hdg)+'°';
  if(mLa!==null && dLa!==null){
    var b=brng(mLa,mLo,dLa,dLo);
    var d=km(mLa,mLo,dLa,dLo);
    var delta=(b-hdg+360)%360;
    rot('nd', b);
    g('mb').textContent = Math.round(b)+'°';
    g('md').textContent = d>100 ? Math.round(d)+' km' : d.toFixed(1)+' km';
    g('mr').textContent = Math.round(delta)+'°';
    g('dn').textContent = dNm || (dLa.toFixed(3)+', '+dLo.toFixed(3));
  }
  // Aggiorna badge combinato
  var parts=[];
  if(gpsOk)  parts.push('GPS ✓');
  if(oOk)    parts.push('Bussola ✓');
  if(espOk)  parts.push('ESP32 ✓');
  if(parts.length>0) bdg(parts.join('  |  '),'ok');
}

// ── Giroscopio / orientamento ────────────────────────────────
function onOri(e){
  var h=0;
  if(typeof e.webkitCompassHeading!=='undefined' && e.webkitCompassHeading!==null){
    h=e.webkitCompassHeading;          // iOS: già corretto verso il Nord
  } else if(e.alpha!==null){
    h=(360-e.alpha)%360;               // Android
  }
  hdg=h; ui();
}

function startOri(){
  if(typeof DeviceOrientationEvent==='undefined'){
    bdg('Giroscopio non supportato su questo dispositivo','err');
    return;
  }
  if(typeof DeviceOrientationEvent.requestPermission==='function'){
    // iOS 13+: richiede gesture utente (già siamo dentro onclick)
    DeviceOrientationEvent.requestPermission()
      .then(function(state){
        if(state==='granted'){
          window.addEventListener('deviceorientation', onOri, true);
          oOk=true; ui();
        } else {
          bdg('Permesso orientamento negato','err');
        }
      })
      .catch(function(err){
        bdg('Errore orientamento: '+err,'err');
      });
  } else {
    window.addEventListener('deviceorientation', onOri, true);
    oOk=true; ui();
  }
}

// ── GPS ──────────────────────────────────────────────────────
function startGPS(){
  if(!navigator.geolocation){
    bdg('Geolocalizzazione non supportata','err');
    return;
  }
  bdg('Acquisizione GPS...','info');
  navigator.geolocation.watchPosition(
    function(p){
      mLa=p.coords.latitude;
      mLo=p.coords.longitude;
      gpsOk=true;
      ui();
      // Invia all'ESP32 se connesso
      if(espOk) sendToEsp();
    },
    function(e){
      bdg('GPS: '+e.message,'err');
    },
    {enableHighAccuracy:true, maximumAge:3000, timeout:15000}
  );
}

// ── Comunicazione ESP32 ──────────────────────────────────────
// NOTA: funziona solo se il telefono è connesso alla rete ESP32
// e il browser permette Mixed Content (HTTP dentro HTTPS).
// Su molti browser serve abilitarlo manualmente, oppure usare
// la modalità solo-pagina (senza ESP32).

function pingEsp(){
  espIP = g('esp-ip').value.trim() || '192.168.4.1';
  g('esp-status').textContent = 'Connessione a http://'+espIP+'...';
  var xhr=new XMLHttpRequest();
  xhr.timeout=3000;
  xhr.open('GET','http://'+espIP+'/status',true);
  xhr.onload=function(){
    try{
      var d=JSON.parse(xhr.responseText);
      espOk=true;
      g('esp-status').textContent='Connesso ✓ — dest salvata: '+d.dstName;
      // Carica destinazione salvata sull'ESP32
      if(dLa===null && d.dstLat!==0){
        dLa=d.dstLat; dLo=d.dstLon; dNm=d.dstName;
        g('dlat').value=d.dstLat; g('dlon').value=d.dstLon;
        g('dnam').value=d.dstName;
        ui();
      }
    }catch(e){
      g('esp-status').textContent='Risposta non valida';
    }
  };
  xhr.onerror=function(){
    espOk=false;
    g('esp-status').textContent=
      'Non raggiungibile. Verifica: 1) connesso a Bussola-ESP32? '+
      '2) IP corretto? 3) Mixed Content abilitato nel browser?';
  };
  xhr.ontimeout=function(){
    g('esp-status').textContent='Timeout — ESP32 non risponde';
  };
  xhr.send();
}

function sendToEsp(){
  if(!espOk || mLa===null) return;
  var url='http://'+espIP+'/mypos?lat='+mLa+'&lon='+mLo;
  var xhr=new XMLHttpRequest();
  xhr.open('GET',url,true);
  xhr.onerror=function(){ espOk=false; ui(); };
  xhr.send();
}

// ── Destinazione ─────────────────────────────────────────────
function qd(la,lo,nm){
  dLa=la; dLo=lo; dNm=nm;
  g('dlat').value=la; g('dlon').value=lo; g('dnam').value=nm;
  ui();
  if(espOk){
    var xhr=new XMLHttpRequest();
    xhr.open('GET','http://'+espIP+'/setdest?lat='+la+'&lon='+lo+
             '&name='+encodeURIComponent(nm),true);
    xhr.send();
  }
}

function sendDest(){
  var la=parseFloat(g('dlat').value), lo=parseFloat(g('dlon').value);
  var nm=g('dnam').value||'Personalizzata';
  if(isNaN(la)||isNaN(lo)){alert('Inserisci coordinate valide');return;}
  qd(la,lo,nm);
}

// ── Avvio ────────────────────────────────────────────────────
function startAll(){
  bdg('Avvio in corso...','info');
  startGPS();
  startOri();
}
</script>
</body>
</html>
