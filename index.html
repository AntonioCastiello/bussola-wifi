<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bussola</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
     background:#f5f5f0;color:#1a1a1a;min-height:100vh;
     display:flex;flex-direction:column;align-items:center;
     justify-content:center;padding:1.5rem 1rem;gap:1rem}
h1{font-size:17px;font-weight:500;color:#555;text-align:center}
.sub{font-size:12px;color:#aaa;text-align:center;letter-spacing:.3px;margin-top:.2rem}
.card{background:#fff;border-radius:20px;padding:1.5rem;
      border:0.5px solid rgba(0,0,0,0.07);
      box-shadow:0 4px 20px rgba(0,0,0,0.07);
      width:100%;max-width:320px;
      display:flex;flex-direction:column;align-items:center;gap:.75rem}
#cvs{width:260px;height:260px}
.dist{font-size:32px;font-weight:700;color:#1D9E75;text-align:center}
.dist span{font-size:14px;font-weight:400;color:#aaa;margin-left:4px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.metric{background:#f8f8f4;border-radius:10px;padding:.6rem .75rem;text-align:center}
.metric .lbl{font-size:10px;color:#aaa;letter-spacing:.4px;text-transform:uppercase}
.metric .val{font-size:18px;font-weight:600;color:#1a1a1a;margin-top:1px}
.badge{text-align:center;font-size:13px;padding:8px 20px;border-radius:10px;
       background:#fff8e1;color:#795548;width:100%;max-width:320px}
.badge.ok  {background:#e8f5e9;color:#2e7d32}
.badge.err {background:#ffebee;color:#c62828}
.badge.info{background:#e3f2fd;color:#1565c0}
#start-btn{padding:14px 40px;border:none;border-radius:14px;
           font-size:16px;font-weight:500;background:#1D9E75;color:#fff;
           cursor:pointer;box-shadow:0 4px 14px rgba(29,158,117,.35)}
#start-btn:active{opacity:.8}
</style>
</head>
<body>

<div>
  <h1>&#129517; Bussola</h1>
  <p class="sub">40°51′57.5″N &nbsp; 14°23′51.1″E</p>
</div>

<div id="badge" class="badge">Premi Avvia</div>

<div class="card">
  <svg id="cvs" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Quadrante -->
    <circle cx="100" cy="100" r="96" fill="#fafafa" stroke="#ebebeb" stroke-width="1.5"/>
    <circle cx="100" cy="100" r="70" fill="none" stroke="#f4f4f4" stroke-width="1"/>
    <!-- Tacche principali -->
    <g stroke="#e0e0e0" stroke-width="1.5">
      <line x1="100" y1="4"   x2="100" y2="22"/>
      <line x1="100" y1="178" x2="100" y2="196"/>
      <line x1="4"   y1="100" x2="22"  y2="100"/>
      <line x1="178" y1="100" x2="196" y2="100"/>
    </g>
    <!-- Tacche secondarie -->
    <g stroke="#ececec" stroke-width="0.8">
      <line x1="152" y1="11"  x2="145" y2="23"/>
      <line x1="189" y1="48"  x2="177" y2="55"/>
      <line x1="189" y1="152" x2="177" y2="145"/>
      <line x1="152" y1="189" x2="145" y2="177"/>
      <line x1="48"  y1="189" x2="55"  y2="177"/>
      <line x1="11"  y1="152" x2="23"  y2="145"/>
      <line x1="11"  y1="48"  x2="23"  y2="55"/>
      <line x1="48"  y1="11"  x2="55"  y2="23"/>
    </g>
    <!-- Lettere cardinali fisse (non ruotano) -->
    <text x="100" y="19"  text-anchor="middle" font-size="13" fill="#ccc">N</text>
    <text x="100" y="196" text-anchor="middle" font-size="13" fill="#ccc">S</text>
    <text x="193" y="105" text-anchor="middle" font-size="13" fill="#ccc">E</text>
    <text x="7"   y="105" text-anchor="middle" font-size="13" fill="#ccc">O</text>
    <!-- Freccia unica verso la destinazione -->
    <g id="arrow" transform="rotate(0,100,100)">
      <!-- Corpo freccia -->
      <polygon points="100,28 107,95 100,112 93,95" fill="#1D9E75"/>
      <!-- Coda -->
      <polygon points="100,112 107,95 100,172 93,95" fill="#d0ede6"/>
      <!-- Punta decorativa -->
      <polygon points="100,22 108,42 100,36 92,42" fill="#1D9E75"/>
      <!-- Centro -->
      <circle cx="100" cy="100" r="10" fill="#fff" stroke="#1D9E75" stroke-width="2.5"/>
      <circle cx="100" cy="100" r="3.5" fill="#1D9E75"/>
    </g>
  </svg>

  <div class="dist"><span id="dist-val">--</span><span id="dist-unit">km</span></div>

  <div class="metrics">
    <div class="metric"><div class="lbl">Bearing</div><div class="val" id="mb">--°</div></div>
    <div class="metric"><div class="lbl">Heading</div><div class="val" id="mh">--°</div></div>
  </div>
</div>

<button id="start-btn" onclick="startAll()">Avvia</button>

<script>
// ── Destinazione fissa ────────────────────────────────────────
var DST_LAT = 40.865972;
var DST_LON  = 14.397528;

var mLa=null, mLo=null, hdg=0, oOk=false, gpsOk=false;

// ── Matematica ────────────────────────────────────────────────
function toRad(d){ return d * Math.PI / 180; }

function bearing(la1, lo1, la2, lo2){
  var dL = toRad(lo2 - lo1);
  var r1 = toRad(la1), r2 = toRad(la2);
  var y  = Math.sin(dL) * Math.cos(r2);
  var x  = Math.cos(r1)*Math.sin(r2) - Math.sin(r1)*Math.cos(r2)*Math.cos(dL);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

function haversine(la1, lo1, la2, lo2){
  var R  = 6371;
  var da = toRad(la2 - la1), dlo = toRad(lo2 - lo1);
  var a  = Math.sin(da/2)*Math.sin(da/2) +
           Math.cos(toRad(la1))*Math.cos(toRad(la2))*
           Math.sin(dlo/2)*Math.sin(dlo/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ── UI ────────────────────────────────────────────────────────
function g(id){ return document.getElementById(id); }

function bdg(msg, cls){
  var b = g('badge');
  b.textContent = msg;
  b.className = 'badge' + (cls ? ' '+cls : '');
}

function ui(){
  if(mLa === null) return;

  var b = bearing(mLa, mLo, DST_LAT, DST_LON);
  var d = haversine(mLa, mLo, DST_LAT, DST_LON);

  // Angolo freccia = bearing verso destinazione MENO heading corrente
  // Così la freccia è relativa all'orientamento del telefono
  var arrowAngle = (b - hdg + 360) % 360;

  g('arrow').setAttribute('transform', 'rotate('+arrowAngle.toFixed(2)+',100,100)');
  g('mb').textContent = Math.round(b) + '°';
  g('mh').textContent = Math.round(hdg) + '°';

  if(d >= 1){
    g('dist-val').textContent = d > 100 ? Math.round(d) : d.toFixed(1);
    g('dist-unit').textContent = ' km';
  } else {
    g('dist-val').textContent = Math.round(d * 1000);
    g('dist-unit').textContent = ' m';
  }

  if(oOk && gpsOk) bdg('Punta la freccia verde verso la destinazione', 'ok');
}

// ── Orientamento ──────────────────────────────────────────────
function onOrientation(e){
  if(typeof e.webkitCompassHeading !== 'undefined' && e.webkitCompassHeading !== null){
    // iOS: heading già in gradi da nord, senso orario
    hdg = e.webkitCompassHeading;
  } else if(e.alpha !== null){
    // Android: alpha = rotazione del dispositivo rispetto al nord geografico
    // Già in senso orario, non serve invertire
    hdg = e.alpha;
  }
  ui();
}

function startOri(){
  if(typeof DeviceOrientationEvent === 'undefined'){
    bdg('Giroscopio non disponibile', 'err'); return;
  }
  if(typeof DeviceOrientationEvent.requestPermission === 'function'){
    // iOS 13+
    DeviceOrientationEvent.requestPermission()
      .then(function(state){
        if(state === 'granted'){
          window.addEventListener('deviceorientation', onOrientation, true);
          oOk = true;
        } else {
          bdg('Permesso orientamento negato', 'err');
        }
      })
      .catch(function(err){ bdg('Errore: ' + err, 'err'); });
  } else {
    window.addEventListener('deviceorientation', onOrientation, true);
    oOk = true;
  }
}

// ── GPS ───────────────────────────────────────────────────────
function startGPS(){
  if(!navigator.geolocation){ bdg('GPS non disponibile', 'err'); return; }
  bdg('Acquisizione GPS...', 'info');
  navigator.geolocation.watchPosition(
    function(p){
      mLa = p.coords.latitude;
      mLo = p.coords.longitude;
      gpsOk = true;
      ui();
    },
    function(e){ bdg('GPS: ' + e.message, 'err'); },
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 }
  );
}

// ── Avvio ─────────────────────────────────────────────────────
function startAll(){
  g('start-btn').style.display = 'none';
  startOri();
  startGPS();
}
</script>
</body>
</html>
